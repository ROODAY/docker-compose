# proxy-blr: DigitalOcean droplet (BLR1, Bangalore). Plex edge for clients in
# South Asia: relays to proxy-west / proxy-east (see ../plex-edge). Also
# librespeed, for testing the client -> edge leg.
# for port mapping, left side is host, right side is container
networks:
  proxy:
    name: proxy
    driver: bridge

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7.19
    container_name: traefik
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./data/traefik/letsencrypt:/letsencrypt
      - ./data/traefik/htpasswd-librespeed:/etc/traefik/htpasswd-librespeed:ro
      # Mount directories, not files: git replaces files on pull, and a
      # single-file bind mount would keep serving the old inode. The file
      # provider loads both subdirectories: this proxy's own routes, and the
      # Plex routing shared by every proxy (../plex-edge).
      - ./traefik:/etc/traefik/dynamic/local:ro
      - ../plex-edge/traefik:/etc/traefik/dynamic/plex-edge:ro
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      # Which proxy this is, for ../plex-edge/traefik/plex.yml.
      - PROXY_NAME=proxy-blr
    command:
      - --log.level=WARN
      - --accesslog=true
      # Field filtering only applies to the JSON format.
      - --accesslog.format=json
      # Plex sends X-Plex-Token in the query string, which Traefik logs as part
      # of RequestPath. Traefik cannot redact part of a field, so drop it.
      # Request headers (including an X-Plex-Token header) are dropped by default.
      - --accesslog.fields.names.RequestPath=drop
      # Every route is in the file provider. No docker provider, so this
      # internet-facing proxy does not need the docker socket.
      - --providers.file.directory=/etc/traefik/dynamic
      # No watch: Traefik only watches the top directory, which here holds
      # just the two mounted subdirectories. update-containers.sh sends
      # SIGHUP after every deploy instead; after a manual edit run
      # `docker kill -s HUP traefik`.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Traefik v3 defaults readTimeout to 60s, which cuts off slow uploads
      # (Plex camera upload). nginx had no equivalent limit.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # DNS-01 via Cloudflare, so it works whether a record is orange or grey.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    logging: *logging

  librespeed:
    image: lscr.io/linuxserver/librespeed:v6.3.1-ls299
    container_name: librespeed
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - PASSWORD=${LIBRESPEED_PASSWORD}
    volumes:
      - ./data/librespeed:/config
    logging: *logging
