# for port mapping, left side is host, right side is container
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - private
    ports:
      - 9091:9091 # qbittorrent webui, published HERE not on qbittorrent
      - ${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}
      - ${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}/udp
    volumes:
      - ./data/gluetun:/gluetun
      - /home/rooday/openvpn:/gluetun/custom/
      - /home/rooday/openvpn/${GLUETUN_VPN_CONFIG}.conf:/gluetun/wireguard/wg0.conf:ro
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24
      - TZ=America/Los_Angeles
    logging:
      driver: json-file
      options:
        max-size: 10m
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbit.engager.ts.rooday.com`)
      - traefik.http.services.qbittorrent.loadbalancer.server.port=9091
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls.certresolver=cloudflare
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - /mnt/storage/torrents:/data/torrents
      - ./data/qbittorrent:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=9091
      - TORRENTING_PORT=${TRANSMISSION_PEER_PORT}
    logging:
      driver: json-file
      options:
        max-size: 10m
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - private
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./data/bazarr:/config
      - /mnt/storage/media:/data/media
    ports:
      - 6767:6767
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.engager.ts.rooday.com`)
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls.certresolver=cloudflare
      - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto = https
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - private
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:prowlarr
      - TP_THEME=dracula
    volumes:
      - ./data/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.engager.ts.rooday.com`)
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - private
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:radarr
      - TP_THEME=dracula
    volumes:
      - ./data/radarr:/config
      - /mnt/storage:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.engager.ts.rooday.com`)
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - private
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:sonarr
      - TP_THEME=dracula
    volumes:
      # - ./data/sonarr:/config
      - /home/rooday/docker-data/sonarr:/config
      - /mnt/storage:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.engager.ts.rooday.com`)
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - private
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=America/New_York
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.engager.ts.rooday.com`)
      - traefik.http.services.flaresolverr.loadbalancer.server.port=8191
      - traefik.http.routers.flaresolverr.entrypoints=websecure
      - traefik.http.routers.flaresolverr.tls.certresolver=cloudflare
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    networks:
      - private
    init: true
    user: 1000:1000
    volumes:
      - ./data/recyclarr:/config
    environment:
      - TZ=America/New_York
    labels:
      - traefik.enable=false
      - docksmith.version-pin-major=true
  docksmith:
    image: ghcr.io/chrisae9/docksmith:latest
    container_name: docksmith
    user: root
    networks:
      - public
      - private
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/docksmith:/data
      - /home/rooday/docker-compose:/home/rooday/docker-compose:rw
    labels:
      - traefik.enable=true
      - traefik.http.routers.docksmith.rule=Host(`docksmith.engager.ts.rooday.com`)
      - traefik.http.services.docksmith.loadbalancer.server.port=8080
      - traefik.http.routers.docksmith.entrypoints=websecure
      - traefik.http.routers.docksmith.tls.certresolver=cloudflare
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    networks:
      - private
    volumes:
      - ./data/cleanuparr:/config
      - /mnt/storage/torrents:/data/torrents
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=America/New_York
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s # Check every 30 seconds
      timeout: 10s # Allow up to 10 seconds for response
      start_period: 30s # Wait 30 seconds before first check
      retries: 3 # Mark unhealthy after 3 consecutive failures
    labels:
      - traefik.enable=true
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.engager.ts.rooday.com`)
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
      - traefik.http.routers.cleanuparr.entrypoints=websecure
      - traefik.http.routers.cleanuparr.tls.certresolver=cloudflare


