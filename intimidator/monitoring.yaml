# for port mapping, left side is host, right side is container
services:
  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    #user: 1000:1000
    networks:
      - public
    volumes:
      - ${BASE_DOCKER_VOLUME_PATH}/monitoring/influxdb/data:/var/lib/influxdb2
      - ${BASE_DOCKER_VOLUME_PATH}/monitoring/influxdb/config:/etc/influxdb2
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
      - INFLUXDB_DB=db0
      # - DOCKER_INFLUXDB_INIT_MODE=setup
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.influxdb.rule=Host(`influxdb.intimidator.rooday.com`)
      - traefik.http.services.influxdb.loadbalancer.server.port=8086
      - traefik.http.routers.influxdb.entrypoints=websecure
      - traefik.http.routers.influxdb.tls.certresolver=cloudflare
  grafana:
    container_name: grafana
    image: grafana/grafana:13.3.0
    networks:
      - public
    user: 1000:1000
    volumes:
      - ${BASE_DOCKER_VOLUME_PATH}/monitoring/grafana:/var/lib/grafana
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=${FFD_GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${FFD_GF_SECURITY_ADMIN_PASSWORD}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.intimidator.rooday.com`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=cloudflare
