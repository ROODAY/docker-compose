# TCP tuning for the Plex edge proxies (installed to /etc/sysctl.d/; see
# ../README.md). Measured 2026-11-16, one stream home server -> US relay ->
# BLR1: ~95 Mbit/s with the Ubuntu defaults (cubic, 4 MB buffers), 130-316
# Mbit/s with these.

# BBR copes with loss on long paths far better than cubic; it wants fq pacing.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Allow windows big enough for ~250 ms round trips (64 MB max per socket;
# autotuning only grows a buffer as far as a connection needs).
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 131072 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# Plex streams in bursts; do not drop back to slow start between them.
net.ipv4.tcp_slow_start_after_idle = 0
