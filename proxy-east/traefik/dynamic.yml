# Routes specific to proxy-east. The Plex routes and the TLS options are shared
# by every proxy: plex-edge/traefik/plex.yml at the repo root. Certificates
# come from the `letsencrypt` resolver (Cloudflare DNS-01), so they work with
# the record orange or grey. Keep the Plex and librespeed records grey:
# Cloudflare's free plan forbids proxying video, caps uploads at 100 MB, and
# would put itself in the speed test.

http:
  routers:
    librespeed:
      rule: Host(`librespeed.proxy-east.rooday.com`)
      entryPoints: [websecure]
      service: librespeed
      middlewares: [librespeed-auth]
      tls:
        certResolver: letsencrypt
    uptime-kuma:
      rule: Host(`status2.rooday.com`)
      entryPoints: [websecure]
      service: uptime-kuma
      tls:
        certResolver: letsencrypt

  middlewares:
    librespeed-auth:
      basicAuth:
        # bcrypt htpasswd in data/traefik (see README).
        usersFile: /etc/traefik/htpasswd-librespeed
        removeHeader: true

  services:
    librespeed:
      loadBalancer:
        servers:
          - url: http://librespeed:80
    uptime-kuma:
      loadBalancer:
        servers:
          - url: http://uptime-kuma:3001
