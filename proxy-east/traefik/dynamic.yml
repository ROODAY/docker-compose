# All routes for proxy-east. Certificates come from the `letsencrypt` resolver
# (HTTP-01), so these DNS records must stay grey-clouded in Cloudflare.

tls:
  options:
    default:
      # Reject handshakes for hostnames we do not serve (nginx's
      # ssl_reject_handshake default server did the same).
      sniStrict: true
      minVersion: VersionTLS12

http:
  routers:
    plex-proxy:
      rule: Host(`plex-proxy.engager.rooday.com`)
      entryPoints: [websecure]
      service: plex
      middlewares: [plex-compress]
      tls:
        certResolver: letsencrypt
    librespeed:
      rule: Host(`librespeed.plex-proxy.engager.rooday.com`)
      entryPoints: [websecure]
      service: librespeed
      middlewares: [librespeed-auth]
      tls:
        certResolver: letsencrypt
    uptime-kuma:
      rule: Host(`status2.rooday.com`)
      entryPoints: [websecure]
      service: uptime-kuma
      tls:
        certResolver: letsencrypt

  middlewares:
    librespeed-auth:
      basicAuth:
        # Copied from /etc/nginx/.htpasswd-librespeed by migrate.sh.
        usersFile: /etc/traefik/htpasswd-librespeed
        removeHeader: true
    plex-compress:
      # Same text types nginx gzipped; never media streams.
      compress:
        minResponseBodyBytes: 1000
        includedContentTypes:
          - text/plain
          - text/css
          - text/xml
          - text/javascript
          - application/xml
          - application/javascript
          - application/x-javascript
          - application/json
          - image/svg+xml

  serversTransports:
    plex:
      serverName: plex.engager.rooday.com

  services:
    plex:
      loadBalancer:
        # Send Host: plex.engager.rooday.com, like nginx's proxy_pass did,
        # so engager's Traefik routes it.
        passHostHeader: false
        serversTransport: plex
        servers:
          - url: https://plex.engager.rooday.com
    librespeed:
      loadBalancer:
        servers:
          - url: http://librespeed:80
    uptime-kuma:
      loadBalancer:
        servers:
          - url: http://uptime-kuma:3001
